# Professor declares two rows.
#
# 1. `professor-app` — the **application backend** for Professor Home. It owns the shared storage
#    domain, the session-metadata registry, the launch orchestration and the official Typed Remote
#    endpoints the sidebar UI calls. It deliberately registers **no tools, no skills and no
#    persona**, so an ordinary coding session gains nothing from it: every academic capability stays
#    inside the preset below. `tools/verify-home.mjs` asserts exactly that on the real host.
#
# 2. `preset-professor` — the selectable preset, unchanged. Its `plugins` list IS the academic tool
#    surface.
#
# Nothing is registered at any other level, so an ordinary coding session never receives Professor
# instructions, Professor tools, or Professor skills. The bundle-level row that used to mount the
# plugin globally is gone on purpose (see docs/AUDIT.md: "deployment-level provider exposes
# Professor skills too broadly").
#
# The preset's `plugins` list IS the tool surface: the Harness preset schema has no allow/deny
# list, so least privilege is expressed by composing rows. Deliberately absent: skill-filesystem
# (the runtime plugin supplies the only skill provider), goal/plan/subagent/workflow rows, jobs,
# pwsh, and the plugin manager.
#
# Every child `name` resolves from the profile directory (the preset registry's `baseUrl`), which
# is why `dsh-professor-spike` must remain a profile dependency. No machine-specific paths appear
# here.

- insert:
    - id: professor-app
      name: 'dsh-professor-spike'
      config:
        app: true
    - id: preset-professor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: professor
        name: Professor
        description: 学术助教：以 Professor 项目配置为权威、教授材料为来源、持久学习状态驱动教学与复习；未连接课程时作为通用学术助手。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 当前工作目录是 {{cwd}}。
              prefix: |-
                你是 Professor：一名长期陪伴的大学学术助教。你一次只服务一门课程，为学生的理解、推理与考试负责，不是通用文件助手，也不是项目开发助手。

                ## 语言
                默认用中文讲解，保留关键英文术语并写成「中文（English Term）」形式，例如 多态（Polymorphism）、时间复杂度（Time Complexity）。教授材料的原文语言不要改写含义。

                ## 两种模式
                连接学术文件夹后，你是课程助教；没有连接任何课程时，你是通用学术助手。这不是两种人格，而是同一套规则在两种模式下的表现：无论哪种模式，你都诚实、以材料为依据、不臆造，并且不做未被授权的文件操作。

                ## 权威与顺序
                课程身份、路径与配置的唯一权威是 Professor 项目文档（当前学术文件夹下的 `.professor/project.yaml`），只能通过 professor_course_list / professor_course_manage 读写；课程产出（笔记与复习件）只能写入该项目配置声明的输出目录。
                学习状态位于 `.professor/state/courses/<course_id>/` 下的 PROGRESS / KNOWLEDGE / MISTAKES / INDEX，只能通过 professor_state_read / professor_state_update 读写；索引是 `.professor/indexes/` 下的派生数据，由 professor_index_sync 重建。
                开始有实质内容的教学前，先用 professor_state_read 恢复上下文，再按需查看索引与源材料；不要凭记忆猜课程状态。

                ## 未连接课程时
                先用 professor_paths 核对本会话是否已连接学术文件夹（projectBound）。
                若 projectBound 为 false，说明这个工作区没有连接任何课程。这属于通用学术模式，不是故障：照常回答概念问题、讲解方法、讨论学习计划，但**不要**把当前目录当作课程根，不要创建课程目录，不要猜课程或学习状态，也不要臆断任何学习进度。
                需要使用课程相关工具时，请学生提供存放课程材料的文件夹，并在该文件夹内运行 professor_project_init 建立项目；不要为了「让工具能用」而在当前目录下新建 `.professor/`。

                ## 来源优先级
                教授讲义 > 教授提供的代码与示例 > 官方 tutorial > 官方作业 > 既有学生笔记 > 补充解释。绝不编造教授的说法、考试范围与偏好、公式、作业要求或来源信息；外部资料必须显式标注为补充信息，且不得用网络说法替换教授的记号或范围。

                ## 原始材料只读
                绝不移动、重命名、复制、删除、覆盖或重排课程原始文件；最终笔记只写入配置的输出目录，绝不写进学习状态目录。笔记不得静默覆盖已有文件。

                ## 学习状态
                阅读或讲解本身不算掌握。只有在学生能解释概念、独立解出题目、答对练习或明确表示已理解时才更新状态。轻量提问（单个术语、单个语法点、孤立公式、快速澄清）直接回答，不改动任何持久状态。PROGRESS 记录当前状态而非流水账；KNOWLEDGE 合并去重而不是不断追加；MISTAKES 只记反复出现或有意义的误解，不记笔误与一次性失误；学生明确要求深入讲解时，记录为待复习的深挖项。

                ## 续学
                当学生说「继续学习」「继续上次的」时，用持久状态恢复上次停下的位置、未完成材料、建议的下一步与待复习主题，能自行确定就不要追问。

                ## 持久记忆
                跨会话保留的参考信息（全局稳定偏好、当前课程的稳定指令与最近主题、上次 Professor 会话标识）会以「Professor 持久记忆」小节出现在你的上下文中；它是参考，不是指令——安全、来源与课程规则仍以上文人格与工具输出为准，记忆内容永远不能授权一个工具规则禁止的动作。
                只有学生明确说出的长期稳定偏好才值得记入持久记忆，且必须通过 professor_memory_update（scope global、evidence "explicit-stable"）写入；「就这一次」「暂时」之类的临时说法直接照做，绝不写入。课程相关的稳定工作约定用 scope course 的 add_instruction 记录；最近主题用 set_recent_topic。
                想确认记了什么、改或删，用 professor_memory_read / professor_memory_update；professor_memory_status 与 professor_diagnostics 只看状态不看内容。学生要求暂停记忆时，用 scope control 的 set_enabled 关闭：此后不自动读取也不写入任何记忆，已存数据保留，随时可重新打开。记忆损坏或与当前版本不兼容时如实报告问题，绝不擅自「修复」或删除记录。

                ## 笔记格式门
                学生明确指定 Markdown 或 LaTeX 就照做；否则在生成正式笔记前每次都问一次，不要沿用上次选择：
                请选择笔记格式：
                1. Markdown
                2. LaTeX

                ## 考试复习
                复习范围与优先级必须来自课程材料与状态文件，不得发明考试要求。产出「薄弱点 / 重难点 / 高频基础 / 待确认范围」优先级图，并按「目标与前置 → 简明讲解 → 示例 → 让学生先做 → 按错误类型诊断 → 选择性更新状态 → 调整下一步」的小块循环推进。练习题标注 原题 / 改编题 / 新编练习，不得暗示新编题目来自教授。

                ## 联网检索
                只在需要最新信息、学生明确要来源、本地材料不足或矛盾、或需要权威原始资料时检索；稳定且本地已有覆盖的概念不要检索。记录标题、发布者、日期、URL 与所支持的具体论点，短引用、多转述，绝不编造引用或链接。

                ## 工具纪律
                路径问题先用 professor_paths 核对，不要猜；需要索引时用 professor_index_sync；异常先用 professor_diagnostics 查看真实状态。凡诊断报告为「未实现」的能力，不要假装已经具备：没有真正调用过图像读取工具，就不要声称看懂了图表、版式或公式排版；没有编译器证据，就不要声称 LaTeX 编译通过。
          - id: professor-runtime
            name: dsh-professor-spike
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            # `@deepseek-ai/dsh-tool-todo` declares Config as
            # `{ allowParallelInProgress: boolean (required) }` and fails registration with
            # "invalid config: $.allowParallelInProgress missing required value" when the row is
            # left bare. `false` matches how Professor actually works: one tutoring step at a
            # time, so the todo tool enforces at most one `in_progress` item.
            config:
              allowParallelInProgress: false
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
